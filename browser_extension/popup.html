<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:14px;width:300px;color:#202320;background:#f7f8f4}
    h1{font-size:15px;margin:0 0 6px}p{margin:5px 0 11px;color:#626862}.row{display:flex;gap:7px}input{width:100%;padding:8px;border:1px solid #cfd3cc;border-radius:8px;font:inherit;letter-spacing:.08em}button{border:0;border-radius:8px;padding:8px 10px;background:#1f231f;color:white;font-weight:650;cursor:pointer}.status{margin-top:10px;padding:8px;border-radius:8px;background:white;border:1px solid #e1e3dd}.ok{color:#24653f}.bad{color:#8b4b26}
  </style>
</head>
<body>
  <h1>OpenWorkGraph browser sensor</h1>
  <p id="intro">Checking local pairing…</p>
  <div class="row"><input id="code" inputmode="numeric" maxlength="8" placeholder="Pairing code"><button id="pair">Pair</button></div>
  <div class="status" id="status">Open the Workflow Observer dashboard and choose Pair / repair browser sensor if pairing is needed.</div>
  <script src="popup.js"></script>
</body>
</html>
