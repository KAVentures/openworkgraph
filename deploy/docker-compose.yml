services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openworkgraph
      POSTGRES_USER: openworkgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - openworkgraph-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openworkgraph -d openworkgraph"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OWG_GATEWAY_DATABASE_URL: postgresql://openworkgraph:${POSTGRES_PASSWORD}@postgres:5432/openworkgraph
      OWG_GATEWAY_ADMIN_TOKEN: ${OWG_GATEWAY_ADMIN_TOKEN}
      OWG_GATEWAY_ENROLLMENT_TOKEN: ${OWG_GATEWAY_ENROLLMENT_TOKEN}
      OWG_GATEWAY_DB_POOL_MIN_SIZE: ${OWG_GATEWAY_DB_POOL_MIN_SIZE:-0}
      OWG_GATEWAY_DB_POOL_MAX_SIZE: ${OWG_GATEWAY_DB_POOL_MAX_SIZE:-0}
      OWG_GATEWAY_DB_POOL_TIMEOUT_SECONDS: ${OWG_GATEWAY_DB_POOL_TIMEOUT_SECONDS:-10}
      OWG_GATEWAY_PRINCIPAL_RATE_LIMIT_PER_MINUTE: ${OWG_GATEWAY_PRINCIPAL_RATE_LIMIT_PER_MINUTE:-0}
      OWG_GATEWAY_ADMIN_RATE_LIMIT_PER_MINUTE: ${OWG_GATEWAY_ADMIN_RATE_LIMIT_PER_MINUTE:-0}
      OWG_GATEWAY_ENROLLMENT_RATE_LIMIT_PER_MINUTE: ${OWG_GATEWAY_ENROLLMENT_RATE_LIMIT_PER_MINUTE:-0}
      OWG_GATEWAY_OIDC_ISSUER: ${OWG_GATEWAY_OIDC_ISSUER:-}
      OWG_GATEWAY_OIDC_AUDIENCE: ${OWG_GATEWAY_OIDC_AUDIENCE:-}
      OWG_GATEWAY_OIDC_JWKS_URL: ${OWG_GATEWAY_OIDC_JWKS_URL:-}
      OWG_GATEWAY_OIDC_ORGANIZATION_CLAIM: ${OWG_GATEWAY_OIDC_ORGANIZATION_CLAIM:-owg_org}
      OWG_GATEWAY_OIDC_ACTOR_CLAIM: ${OWG_GATEWAY_OIDC_ACTOR_CLAIM:-sub}
      OWG_GATEWAY_OIDC_GROUPS_CLAIM: ${OWG_GATEWAY_OIDC_GROUPS_CLAIM:-groups}
      OWG_GATEWAY_OIDC_GROUP_SCOPE_MAP: ${OWG_GATEWAY_OIDC_GROUP_SCOPE_MAP:-{}}
      OWG_GATEWAY_OIDC_SELF_READ: ${OWG_GATEWAY_OIDC_SELF_READ:-true}
      OWG_GATEWAY_AGGREGATE_MIN_ACTORS: ${OWG_GATEWAY_AGGREGATE_MIN_ACTORS:-5}
      OWG_GATEWAY_PSEUDONYM_KEY: ${OWG_GATEWAY_PSEUDONYM_KEY:-}
    ports:
      - "${OWG_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${OWG_GATEWAY_PORT:-8790}:8790"

volumes:
  openworkgraph-postgres:
