name: enterprise-stack-acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'server/enterprise_*'
      - 'server/*_feed.py'
      - 'server/google_workspace_audit.py'
      - 'gateway/connector_*'
      - 'shared/connector_*'
      - 'shared/enterprise_connector_contract.py'
      - 'dashboard/enterprise_connectors.*'
      - 'tests/test_enterprise_*'
      - 'tests/test_connector_*'
      - 'tests/test_*_feed.py'
      - 'tests/browser/enterprise_connectors.cjs'
      - 'tests/browser/connector_crosswalks*'
      - '.github/workflows/enterprise-stack-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-stack-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-contract:
    # Validate the consolidated candidate even while it remains a draft.
    # Ordinary feature drafts continue to use the existing cheap smoke path.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'integration/enterprise-connectors-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owg_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: owg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing Gateway and test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Compile integrated Python modules and check dashboard JavaScript
        run: |
          python -m compileall -q server gateway shared
          node --check dashboard/enterprise_connectors.js
          node --check tests/browser/enterprise_connectors.cjs
          node --check tests/browser/connector_crosswalks.cjs
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for p in Path("gateway").glob("connector_*.html"):
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", p.read_text(encoding="utf-8"), flags=re.S)
              for script in scripts:
                  with tempfile.NamedTemporaryFile(suffix=".js", mode="w", encoding="utf-8") as f:
                      f.write(script); f.flush()
                      subprocess.run(["node", "--check", f.name], check=True)
          PY
      - name: Exercise all native connector and integrated lifecycle tests
        env:
          OWG_PROCESS_TEST_DATABASE_URL: postgresql://owg_test:synthetic-ci-password@127.0.0.1:5432/owg_test
        run: |
          python -m pytest -q --tb=short \
            tests/test_enterprise_rest_feed.py \
            tests/test_enterprise_sql_feed.py \
            tests/test_google_workspace_audit.py \
            tests/test_slack_native_feed.py \
            tests/test_salesforce_history_feed.py \
            tests/test_servicenow_operations_feed.py \
            tests/test_sap_procurement_feed.py \
            tests/test_dataverse_audit_feed.py \
            tests/test_hubspot_history_feed.py \
            tests/test_gateway_connector_jobs.py \
            tests/test_enterprise_connector_worker.py \
            tests/test_connector_event_publications.py \
            tests/test_connector_case_review.py \
            tests/test_connector_crosswalks.py \
            tests/test_enterprise_connector_credentials.py \
            tests/test_enterprise_connector_deployment.py \
            tests/test_enterprise_connector_integration.py \
            tests/test_connector_linked_conformance.py \
            tests/test_connector_exception_triage.py
      - name: Install isolated Chromium runtime
        if: success() || failure()
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
      - name: Enterprise connector configuration acceptance
        if: success() || failure()
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/enterprise_connectors.cjs
      - name: Crosswalk and saved review acceptance
        if: success() || failure()
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/connector_crosswalks.cjs
      - name: Verify repository database isolation
        if: success() || failure()
        run: |
          test ! -e data/workflow_observer.db
          test ! -e data/gateway/openworkgraph_gateway.db

  linked-conformance:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/enterprise-linked-conformance-') || startsWith(github.head_ref, 'feat/enterprise-exception-triage-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owg_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: owg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing Gateway and test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Verify conformance rules, exact review pins and worklist export
        env:
          OWG_PROCESS_TEST_DATABASE_URL: postgresql://owg_test:synthetic-ci-password@127.0.0.1:5432/owg_test
        run: python -m pytest -q --tb=short tests/test_connector_linked_conformance.py tests/test_connector_case_review.py tests/test_connector_exception_triage.py
      - name: Install isolated Chromium runtime
        if: success() || failure()
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
      - name: Verify linked conformance browser lifecycle
        if: success() || failure()
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/connector_crosswalks.cjs
