name: cancel closed PR CI

# Trusted default-branch automation. Never checks out or executes PR code.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only (no cancellation)
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: cancel-closed-pr-ci
  cancel-in-progress: false

jobs:
  cancel-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify cancellation policy with mocked API
        run: node --test .github/scripts/cancel_closed_pr_runs.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const {run} = require('./.github/scripts/cancel_closed_pr_runs.cjs');
            await run({github, context, core});
