name: explorer-accessibility

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  wcag-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install isolated Chromium and axe-core
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify explorer WCAG 2.1 AA and keyboard-only use
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/explorer_accessibility.cjs
      - name: Verify supplied OCEL relationship inspection and interchange
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/event_log_object_relationships.cjs
      - name: Verify supplied graph constraints, empty graphs and guarded exports
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/supplied_object_constraints.cjs
      - name: Verify local FIRST precedence, review invalidation and guarded reports
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/first_decision_policy_local.cjs
      - name: Verify shared FIRST editing, review, tenant isolation and guarded exports
        run: OWG_TEST_FIRST_POLICY=1 NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/process_decision_tables.cjs
      - name: Verify bounded SCIM bulk lifecycle and guarded admin sessions
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/scim_provisioning.cjs
      - name: Verify overlap-aware waiting boundaries and stale-setting guards
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/waiting_boundary_attribution.cjs
      - name: Verify declared calendar analytics and guarded aggregate downloads
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/working_calendar_analysis.cjs
