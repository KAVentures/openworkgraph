name: tests

on:
  push:
    branches: ["main", "hardening/context-layer-v32"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  browser-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser sensor JavaScript syntax
        run: |
          node --check browser_extension/browser_auth.js
          node --check browser_extension/secure_background.js
          node --check browser_extension/popup.js
          node --check browser_extension/background.js
          node --check browser_extension/workflow_enrichment.js
          node --check browser_extension/content.js
          node --check browser_extension/content_enrichment.js
          node --check dashboard/gateway_panel.js
      - name: Authenticated dashboard JavaScript syntax
        run: python scripts/check_injected_dashboard_js.py
      - name: Browser sensor JavaScript tests
        run: node --test tests/js/*.test.mjs

  gateway-container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test-postgres-password
      OWG_GATEWAY_ADMIN_TOKEN: test-admin-token
      OWG_GATEWAY_ENROLLMENT_TOKEN: test-enrollment-token
      OWG_GATEWAY_PORT: "8790"
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-host compose configuration
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Build self-hosted Gateway image
        run: docker build -f deploy/Dockerfile.gateway -t openworkgraph-gateway:test .
      - name: Start PostgreSQL and Gateway
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for Gateway health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8790/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Exercise PostgreSQL tenant data plane
        run: |
          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8790"

          def request(method, path, body=None, token=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.loads(response.read().decode())

          health = request("GET", "/health")
          assert health["version"] == "0.54.0", health

          device = request("POST", "/v1/devices/enroll", {
              "organization_id": "ci-acme",
              "actor_id": "ci-alice",
              "device_id": "ci-device",
          }, "test-enrollment-token")

          event = {
              "event_id": "ci-event-1",
              "observed_at": "2026-09-22T10:00:00+00:00",
              "organization_id": "spoofed-org",
              "actor_id": "spoofed-actor",
              "device_id": "spoofed-device",
              "sensor_id": "browser:ci",
              "source": "browser_extension",
              "session_id": "ci-session",
              "app": "Browser",
              "window_title": "CI rich evidence",
              "event_type": "browser_paste",
              "duration_seconds": 0,
              "metadata": {
                  "action": "paste",
                  "tab_context_id": "runtime:ci-tab",
                  "clipboard_transfer_id": "ci-transfer",
                  "privacy": {"typed_values": False, "clipboard_contents": False, "key_identities": False},
              },
          }
          ingest = request("POST", "/v1/evidence/batch", {"events": [event]}, device["token"])
          assert ingest["inserted"] == 1, ingest

          service = request("POST", "/v1/admin/integration-tokens", {
              "organization_id": "ci-acme",
              "label": "CI integration",
              "scopes": ["evidence:read", "context:read", "transfers:read"],
          }, "test-admin-token")

          retention = request(
              "PUT",
              "/v1/admin/retention/ci-acme",
              {"retention_days": 365},
              "test-admin-token",
          )
          assert retention["enabled"] is True, retention
          assert retention["retention_days"] == 365, retention
          retention_readback = request(
              "GET",
              "/v1/admin/retention/ci-acme",
              token="test-admin-token",
          )
          assert retention_readback["retention_days"] == 365, retention_readback

          trace = request("GET", "/v1/workflow-trace?limit=10", token=service["token"])
          assert trace["returned"] == 1, trace
          row = trace["rows"][0]
          assert row["organization_id"] == "ci-acme", row
          assert row["actor_id"] == "ci-alice", row
          assert row["device_id"] == "ci-device", row
          assert row["metadata"]["tab_context_id"] == "runtime:ci-tab", row
          assert row["clipboard_transfer_id"] == "ci-transfer", row
          assert trace["derived_task_inference_authoritative"] is False
          print("Gateway/PostgreSQL integration + lifecycle test passed")
          PY
      - name: Show Gateway logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop self-host stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
