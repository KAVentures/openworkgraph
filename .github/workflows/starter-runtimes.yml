name: starter-runtimes

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  generated-starters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Generate a reviewed-process starter
        run: python tests/starter_runtimes/build_starter.py "$RUNNER_TEMP/starter"
      - name: Typecheck and run the AI SDK starter against its pinned packages
        working-directory: ${{ runner.temp }}/starter/integrations/ai-sdk
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p .
          cp "$GITHUB_WORKSPACE/tests/starter_runtimes/ai_sdk_check.ts" .
          node --experimental-strip-types --no-warnings ai_sdk_check.ts
      - name: Load the n8n starter with n8n's workflow library
        run: |
          npm install --prefix "$RUNNER_TEMP/n8n" --no-audit --no-fund n8n-workflow@1.120.33
          NODE_PATH="$RUNNER_TEMP/n8n/node_modules" node tests/starter_runtimes/n8n_check.cjs "$RUNNER_TEMP/starter/integrations/n8n.workflow.json"
