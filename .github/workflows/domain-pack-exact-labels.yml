name: domain-pack-exact-labels

on:
  pull_request:
    paths:
      - "server/event_log_domain_packs.py"
      - "dashboard/event_log_workspace.js"
      - "docs/DOMAIN_PACK_EXACT_LABELS.md"
      - "tests/test_event_log_domain_pack_employee_offboarding.py"
      - "tests/browser/domain_pack_exact_labels.cjs"
      - ".github/workflows/domain-pack-exact-labels.yml"
  push:
    branches: ["main"]
    paths:
      - "server/event_log_domain_packs.py"
      - "dashboard/event_log_workspace.js"
      - "docs/DOMAIN_PACK_EXACT_LABELS.md"
      - "tests/test_event_log_domain_pack_employee_offboarding.py"
      - "tests/browser/domain_pack_exact_labels.cjs"
      - ".github/workflows/domain-pack-exact-labels.yml"

permissions:
  contents: read

jobs:
  exact-label-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local app and tests
        run: python -m pip install -e ".[dev,gateway]"
      - name: Exercise selected real log, mapped rules and ASGI authorization
        run: python -m pytest -q tests/test_event_log_domain_pack_employee_offboarding.py tests/test_event_log_domain_pack_customer_onboarding.py
      - name: Install isolated Chromium and axe
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || {
            # The runner image already has Chromium's libraries; --with-deps only adds fonts and
            # extras. When the apt mirror is unreachable, install the browser without them.
            echo "::warning::apt packages unavailable; installing Chromium without --with-deps"
            node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
          }
      - name: Validate real browser journey syntax
        run: node --check tests/browser/domain_pack_exact_labels.cjs
      - name: Run actual mapped domain-pack install/report/reconfigure/uninstall
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/domain_pack_exact_labels.cjs
