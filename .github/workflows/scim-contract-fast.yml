name: scim-contract-fast

on:
  pull_request:
    paths:
      - 'gateway/scim_*.py'
      - 'tests/test_scim_*.py'
      - '.github/workflows/scim-contract-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its queued and running checks. Pushes to a
# branch share one group without cancel-in-progress: a running main build always finishes, and
# only the newest waiting one is kept. Manual runs get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scim-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing gateway and test dependencies
        run: python -m pip install -e '.[dev,gateway]'
      - name: Validate SCIM Groups and existing Users contracts
        run: |
          python -m pytest -q \
            tests/test_scim_groups.py tests/test_scim_group_name_policy.py \
            tests/test_scim_provisioning.py \
            tests/test_scim_routes.py \
            tests/test_scim_bulk.py \
            tests/test_scim_user_emails.py \
            tests/test_scim_user_names.py \
            tests/test_scim_filter.py \
            tests/test_scim_client_policy.py \
            tests/test_scim_assignment.py \
            tests/test_scim_search.py \
            tests/test_scim_group_bulk.py \
            tests/test_scim_offboarding.py \
            tests/test_scim_upgrade_restore.py \
            tests/test_scim_enrollment_race.py
