name: object-relationship-group-pages
on:
  pull_request:
    paths:
      - 'server/event_log_object_relationships.py'
      - 'server/event_log_topology_review*.py'
      - 'server/event_log_relationship_comparison_routes.py'
      - 'shared/ocel_topology.py'
      - 'shared/ocel_directed_topology.py'
      - 'tests/test_ocel_directed_topology.py'
      - 'tests/test_event_log_directed_topology.py'
      - 'dashboard/object_topology_review.*'
      - 'tests/test_ocel_topology.py'
      - 'server/event_log_routes.py'
      - 'dashboard/event_log_workspace.js'
      - 'tests/test_event_log_object_relationships.py'
      - 'tests/browser/event_log_relationship_group_pages.cjs'
      - 'tests/browser/event_log_object_relationships.cjs'
      - '.github/workflows/object-relationship-group-pages.yml'
  push:
    branches: [main]
    paths:
      - 'server/event_log_object_relationships.py'
      - 'server/event_log_topology_review*.py'
      - 'server/event_log_relationship_comparison_routes.py'
      - 'shared/ocel_topology.py'
      - 'shared/ocel_directed_topology.py'
      - 'tests/test_ocel_directed_topology.py'
      - 'tests/test_event_log_directed_topology.py'
      - 'dashboard/object_topology_review.*'
      - 'tests/test_ocel_topology.py'
      - 'server/event_log_routes.py'
      - 'dashboard/event_log_workspace.js'
      - 'tests/test_event_log_object_relationships.py'
      - 'tests/browser/event_log_relationship_group_pages.cjs'
      - 'tests/browser/event_log_object_relationships.cjs'
      - '.github/workflows/object-relationship-group-pages.yml'
permissions:
  contents: read
jobs:
  relationship-group-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,gateway]'
      - run: python -m pytest -q tests/test_event_log_object_relationships.py tests/test_ocel_topology.py tests/test_event_log_relationship_comparison.py tests/test_ocel_directed_topology.py tests/test_event_log_directed_topology.py
      - name: Install browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
      - name: Exercise group pagination and existing relationship flow
        run: |
          export NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules"
          node tests/browser/event_log_relationship_group_pages.cjs
          node tests/browser/event_log_object_relationships.cjs
