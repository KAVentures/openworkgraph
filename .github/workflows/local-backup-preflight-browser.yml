name: local-backup-preflight-browser

on:
  pull_request:
    paths:
      - "tests/browser/backup_preflight.cjs"
      - "dashboard/basic_mode.js"
      - "server/basic_mode_routes.py"
      - "server/local_backup.py"
      - "server/local_backup_schedule.py"
      - "server/local_scheduler.py"
      - "server/local_scheduler_routes.py"
      - "tests/test_local_scheduler_quiet_hours.py"
      - "tests/browser/scheduled_quiet_hours.cjs"
      - "tests/browser/scheduled_local_backup.cjs"
      - "tests/browser/scheduled_local_backup_app.py"
      - ".github/workflows/local-backup-preflight-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "tests/browser/backup_preflight.cjs"
      - "dashboard/basic_mode.js"
      - "server/basic_mode_routes.py"
      - "server/local_backup.py"
      - "server/local_backup_schedule.py"
      - "server/local_scheduler.py"
      - "server/local_scheduler_routes.py"
      - "tests/test_local_scheduler_quiet_hours.py"
      - "tests/browser/scheduled_quiet_hours.cjs"
      - "tests/browser/scheduled_local_backup.cjs"
      - "tests/browser/scheduled_local_backup_app.py"
      - ".github/workflows/local-backup-preflight-browser.yml"

permissions:
  contents: read

jobs:
  local-backup-preflight-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local app and test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Install isolated Playwright and accessibility tools
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Syntax check the backup operator journey
        run: node --check tests/browser/backup_preflight.cjs
      - name: Verify real authenticated Privacy backup preflight in Chromium
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/backup_preflight.cjs
      - name: Syntax check the local scheduled-backup dashboard flow
        run: node --check tests/browser/scheduled_local_backup.cjs
      - name: Verify explicit local backup scheduling in authenticated Chromium
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/scheduled_local_backup.cjs
      - name: Validate local quiet-hour backend semantics
        run: python -m pytest -q tests/test_local_scheduler_quiet_hours.py
      - name: Validate scheduled quiet-hours browser syntax
        run: node --check tests/browser/scheduled_quiet_hours.cjs
      - name: Verify IANA quiet-hour consent and edits in authenticated Chromium
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/scheduled_quiet_hours.cjs
