name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
          if-no-files-found: error

  mcpb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Claude Desktop MCP bundle
        run: python scripts/build_mcpb.py
      - name: Check MCP bundle contents
        run: |
          python - <<'PY'
          import zipfile
          p = 'dist/OpenWorkGraph-Claude.mcpb'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          assert {'manifest.json', 'server/index.js'} <= names, names
          PY
      - name: Upload Claude MCP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: dist/OpenWorkGraph-Claude.mcpb
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package, mcpb-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets
      - name: Download Claude MCP bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: release-assets
      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is local-first, open-source context infrastructure for how human and AI-agent work actually happens.

          ### Local-first remains the default
          A normal OpenWorkGraph install captures to local SQLite, provides local dashboard/export/API/MCP access, and requires no OpenWorkGraph account or OpenWorkGraph-hosted evidence store. Capture continues locally if an optional customer-controlled Gateway or network is unavailable.

          ### Human + agent execution evidence
          Human desktop/browser evidence and provider-neutral structural agent execution evidence coexist in the canonical local evidence store. Agent evidence can describe observed lifecycle boundaries, model calls, tool calls, handoffs, approvals, errors, duration, token usage and context linkage when those signals are available.

          Missing agent signals mean **not observed**, not proof that the underlying runtime did not perform the action. OpenWorkGraph does not claim to observe hidden model reasoning.

          ### Agent observability
          The local dashboard includes an Agents view with run-level reports and structural execution traces. REST/MCP surfaces provide privacy-safe run inspection for authorized human/AI clients. The write-only agent-ingest token cannot read work history or reports.

          ### Safer agent ingestion
          Agent evidence obeys the same Pause/Stop and permanent deletion boundaries as other local evidence. Untrusted structural identifiers and timestamps are validated, far-future timestamps are rejected, and agent-ingest authentication/size limits are applied before request bodies are fully buffered.

          Prompts, model-response content, tool arguments/results, transcript paths and chain-of-thought/reasoning content are outside the agent evidence contract.

          ### Explicit organization sharing
          The optional organization Gateway remains customer-controlled and outbound-only from the endpoint. Agent evidence is local-only by default even when Gateway synchronization is enabled for other evidence. The endpoint owner must explicitly opt in with `gateway.local_policy.allow_agent_events: true`; organization policy may narrow that opt-in but cannot broaden a local restriction.

          ### Native integrations and OTLP
          OpenWorkGraph includes privacy-minimized integrations for Claude Code, Codex telemetry, OpenAI Agents and generic structural agent ingestion. Claude Code observer hooks are asynchronous so observation does not add tool-call latency. The generic OTLP endpoint currently accepts OTLP/HTTP JSON; exact exporter configuration is documented in **docs/NATIVE_AGENT_ADAPTERS.md**.

          ### Exports
          JSON, CSV ZIP and XLSX exports include a dedicated privacy-safe agent-run table derived from canonical agent evidence. It uses opaque OpenWorkGraph execution references and does not expose native run/trace/span identifiers or agent content payloads.

          ### macOS / Windows testers
          Download **OpenWorkGraph-macOS.zip** or **OpenWorkGraph-Windows.zip** from this release. The standalone desktop product remains usable without an organization Gateway. **AI_GUIDE.md** and **PROMPT.md** are included.

          ### Claude Desktop
          **OpenWorkGraph-Claude.mcpb** is the local stdio MCP wrapper for an existing OpenWorkGraph installation. Local AI access starts OFF on each OpenWorkGraph launch and can be disabled from the local dashboard.

          ### Security note
          Self-hosted production deployments should use customer-controlled TLS/network access, secret management, retention/backups and identity infrastructure appropriate to their environment. OpenWorkGraph's local-first and customer-hosted deployment options do not remove those operational responsibilities.
          EOF

          gh release create "$TAG" \
            release-assets/OpenWorkGraph-macOS.zip \
            release-assets/OpenWorkGraph-macOS.zip.sha256 \
            release-assets/OpenWorkGraph-Windows.zip \
            release-assets/OpenWorkGraph-Windows.zip.sha256 \
            release-assets/OpenWorkGraph-Claude.mcpb \
            --target "$GITHUB_SHA" \
            --title "OpenWorkGraph ${TAG}" \
            --notes-file /tmp/openworkgraph-release-notes.md
