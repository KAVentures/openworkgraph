name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets

      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is a local-first work-telemetry and organizational-context layer for AI.

          ### macOS tester
          Download **OpenWorkGraph-macOS.zip**, unzip it, then right-click **START_OPENWORKGRAPH.command → Open**. The launcher installs its own private runtime; no manual Python setup is required.

          ### Windows tester
          Download **OpenWorkGraph-Windows.zip**, unzip it, then double-click **START_OPENWORKGRAPH.cmd**. The launcher installs its own private runtime; no manual Python setup is required.

          For detailed browser/tab context, run the included **ADD_BROWSER_SENSOR** helper once and load the opened `browser_extension` folder as an unpacked extension.

          Dashboard/API/MCP/export presentation now pseudonymizes detected email addresses, phone numbers and best-effort person names without destructively rewriting the rich local evidence used for workflow inference. No external AI service is used for this redaction.

          Windows also includes best-effort Microsoft UI Automation metadata for native controls without reading typed field values or password values.

          Captured data stays local in this prototype unless the user explicitly exports it.
          EOF

          gh release create "$TAG" \
            release-assets/OpenWorkGraph-macOS.zip \
            release-assets/OpenWorkGraph-macOS.zip.sha256 \
            release-assets/OpenWorkGraph-Windows.zip \
            release-assets/OpenWorkGraph-Windows.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "OpenWorkGraph ${TAG}" \
            --notes-file /tmp/openworkgraph-release-notes.md
