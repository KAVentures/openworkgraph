name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
          if-no-files-found: error

  mcpb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Claude Desktop MCP bundle
        run: python scripts/build_mcpb.py
      - name: Check MCP bundle contents
        run: |
          python - <<'PY'
          import zipfile
          p = 'dist/OpenWorkGraph-Claude.mcpb'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          assert {'manifest.json', 'server/index.js'} <= names, names
          PY
      - name: Upload Claude MCP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: dist/OpenWorkGraph-Claude.mcpb
          if-no-files-found: error

  sdk-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate standalone custom-agent SDKs
        run: |
          python -m py_compile sdk/python/openworkgraph_agent.py
          node --check sdk/typescript/index.mjs
      - name: Stage standalone custom-agent SDK assets
        run: |
          mkdir -p dist
          cp sdk/python/openworkgraph_agent.py dist/OpenWorkGraph-Agent-Python.py
          cp sdk/typescript/index.mjs dist/OpenWorkGraph-Agent-Node.mjs
          cp sdk/typescript/index.d.ts dist/OpenWorkGraph-Agent-Node.d.ts
      - name: Upload custom-agent SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-agent-sdk
          path: |
            dist/OpenWorkGraph-Agent-Python.py
            dist/OpenWorkGraph-Agent-Node.mjs
            dist/OpenWorkGraph-Agent-Node.d.ts
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package, mcpb-package, sdk-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets
      - name: Download Claude MCP bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: release-assets
      - name: Download custom-agent SDK assets
        uses: actions/download-artifact@v4
        with:
          name: pkg-agent-sdk
          path: release-assets
      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is local-first, open-source context infrastructure for how human and AI-agent work actually happens.

          ### First useful reconstruction
          The local dashboard now has an evidence-driven first-value layer designed to become useful during the first real work session. It watches only the existing privacy-hardened local evidence surfaces and, once enough activity exists, offers a deterministic **Your last few minutes** reconstruction. This is a presentation layer over canonical evidence, not a new inference or capture pipeline.

          The activation layer adds no sensor, OS/browser permission, AI permission, retention permission, Gateway sharing, MCP tool, screenshot capture, filesystem watcher, prompt/response capture or content telemetry. It never auto-enables AI access or saved history. Empty first-run placeholders are suppressed until their underlying features have useful data, while Evidence, History, Agents, Connect, Organization and Export remain available unchanged.

          ### Local-first remains the default
          A normal OpenWorkGraph install captures to local SQLite, provides local dashboard/export/API/MCP access, and requires no OpenWorkGraph account or OpenWorkGraph-hosted evidence store. Capture continues locally if an optional customer-controlled Gateway or network is unavailable.

          ### Human + agent execution evidence
          Human desktop/browser evidence and provider-neutral structural agent execution evidence coexist in the canonical local evidence store. Agent evidence can describe observed lifecycle boundaries, model calls, tool calls, handoffs, approvals, errors, duration, token usage and context linkage when those signals are available.

          Missing agent signals mean **not observed**, not proof that the underlying runtime did not perform the action. OpenWorkGraph does not claim to observe hidden model reasoning.

          ### Agent observability
          The local dashboard includes an Agents view with run-level reports and structural execution traces. REST/MCP surfaces provide privacy-safe run inspection for authorized human/AI clients. The write-only agent-ingest token cannot read work history or reports.

          ### Agent setup control plane
          The dashboard now separates giving an AI access to OpenWorkGraph context from observing an agent's own execution. It provides reviewable setup material for Claude Code lifecycle hooks, Codex trace export, OpenAI Agents tracing and generic OpenTelemetry/custom structural adapters. OpenWorkGraph does not silently edit third-party configuration files. An integration is shown as active only when telemetry actually observed by the local evidence store supports that status.

          ### Custom harnesses
          Arbitrary self-built or third-party agent harnesses can connect in either or both directions. Python and Node/TypeScript helpers, OTLP/HTTP JSON and raw structural HTTP can send privacy-safe execution telemetry through the dedicated write-only agent credential. Any MCP-capable harness can separately read only the OpenWorkGraph context the user has authorized. The setup flow keeps telemetry write permission and context/history read permission explicitly separate.

          The standalone helpers do not accept or serialize prompt text, model responses, tool arguments/results, returned values, exception text or hidden reasoning. OpenWorkGraph observer failures remain fail-open for the agent. This release publishes **OpenWorkGraph-Agent-Python.py**, **OpenWorkGraph-Agent-Node.mjs** and **OpenWorkGraph-Agent-Node.d.ts** as standalone release assets.

          ### Compact MCP for new connections
          New dashboard-generated connections, the Claude MCP bundle and the on-demand local HTTP bridge expose a compact MCP surface focused on current context, search, canonical evidence, repeated workflows, task context, prior-run feedback and agent execution inspection. Overlapping tools are consolidated so AI clients have fewer competing tool definitions.

          Existing saved configurations that explicitly launch mcp_server.secure_stdio keep the legacy 24-tool compatibility surface. OpenWorkGraph does not silently remove those tools underneath existing clients. Normative governance tools are experimental on the compact surface and are exposed only when OWG_EXPERIMENTAL_GOVERNANCE is enabled; underlying REST APIs remain available for compatibility.

          ### Readable procedural feedback
          Human prior-run feedback now adds privacy-safe semantic steps such as Gmail · Open email and Salesforce · Open account. These readable labels do not replace the stable structural identity layer or change existing family keys. Unknown web applications remain pseudonymized, and arbitrary names, emails, URLs and UI text are not copied into the readable procedure. The compact current-work overview is also smaller, while get_workflow_trace keeps the canonical rich-row contract with explicit pagination and larger requested pages still available.

          ### Safer agent ingestion
          Agent evidence obeys the same Pause/Stop and permanent deletion boundaries as other local evidence. Untrusted structural identifiers and timestamps are validated, far-future timestamps are rejected, and agent-ingest authentication/size limits are applied before request bodies are fully buffered.

          Prompts, model-response content, tool arguments/results, transcript paths and chain-of-thought/reasoning content are outside the agent evidence contract.

          ### Explicit organization sharing
          The optional organization Gateway remains customer-controlled and outbound-only from the endpoint. Agent evidence is local-only by default even when Gateway synchronization is enabled for other evidence. The endpoint owner must explicitly opt in by setting gateway.local_policy.allow_agent_events=true; organization policy may narrow that opt-in but cannot broaden a local restriction. The policy layer itself also fails closed when an endpoint-local agent-sharing key is missing.

          ### Native integrations and OTLP
          OpenWorkGraph includes privacy-minimized integrations for Claude Code, Codex telemetry, OpenAI Agents and generic structural agent ingestion. Claude Code observer hooks are asynchronous so observation does not add tool-call latency. The generic OTLP endpoint currently accepts OTLP/HTTP JSON; exact exporter configuration is documented in **docs/NATIVE_AGENT_ADAPTERS.md**.

          ### Exports
          JSON, CSV ZIP and XLSX exports include a dedicated privacy-safe agent-run table derived from canonical agent evidence. It uses opaque OpenWorkGraph execution references and does not expose native run/trace/span identifiers or agent content payloads.

          ### macOS / Windows testers
          Download **OpenWorkGraph-macOS.zip** or **OpenWorkGraph-Windows.zip** from this release. The standalone desktop product remains usable without an organization Gateway. **AI_GUIDE.md** and **PROMPT.md** are included.

          ### Claude Desktop
          **OpenWorkGraph-Claude.mcpb** uses the compact local stdio MCP surface for an existing OpenWorkGraph installation. Local AI access starts OFF on each OpenWorkGraph launch and can be disabled from the local dashboard.

          ### Security note
          Self-hosted production deployments should use customer-controlled TLS/network access, secret management, retention/backups and identity infrastructure appropriate to their environment. OpenWorkGraph's local-first and customer-hosted deployment options do not remove those operational responsibilities.
          EOF

          gh release create "$TAG" \
            release-assets/OpenWorkGraph-macOS.zip \
            release-assets/OpenWorkGraph-macOS.zip.sha256 \
            release-assets/OpenWorkGraph-Windows.zip \
            release-assets/OpenWorkGraph-Windows.zip.sha256 \
            release-assets/OpenWorkGraph-Claude.mcpb \
            release-assets/OpenWorkGraph-Agent-Python.py \
            release-assets/OpenWorkGraph-Agent-Node.mjs \
            release-assets/OpenWorkGraph-Agent-Node.d.ts \
            --target "$GITHUB_SHA" \
            --title "OpenWorkGraph ${TAG}" \
            --notes-file /tmp/openworkgraph-release-notes.md
