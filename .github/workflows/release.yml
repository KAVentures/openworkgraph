name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
          if-no-files-found: error

  mcpb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Claude Desktop MCP bundle
        run: python scripts/build_mcpb.py
      - name: Check MCP bundle contents
        run: |
          python - <<'PY'
          import zipfile
          p = 'dist/OpenWorkGraph-Claude.mcpb'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          assert {'manifest.json', 'server/index.js'} <= names, names
          PY
      - name: Upload Claude MCP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: dist/OpenWorkGraph-Claude.mcpb
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package, mcpb-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets
      - name: Download Claude MCP bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: release-assets
      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is a local-first, open-source work-evidence layer for AI. v0.53 adds an **optional self-hosted organization Gateway** without changing the no-account local product.

          ### Local-first remains the default
          A normal OpenWorkGraph install still captures to local SQLite, provides local exports/API/MCP, and requires no OpenWorkGraph account. Gateway sharing is disabled by default. Capture continues locally if a configured Gateway or network is unavailable.

          ### Self-hosted organization Gateway
          Organizations can run the Gateway and PostgreSQL entirely in infrastructure they control. The endpoint connector makes outbound requests to that customer-controlled Gateway after endpoint-side policy filtering. OpenWorkGraph/Kinvectum does not need to receive or store the organization's workflow evidence.

          The repository includes **deploy/Dockerfile.gateway**, **deploy/docker-compose.yml**, and **docs/SELF_HOSTING.md**.

          ### Vendor-neutral REST + MCP
          The Gateway exposes organization-scoped rich evidence through REST for backend platforms such as automation/company-context systems. A thin MCP adapter exposes the same evidence service to AI/agent clients. MCP is an interface, not a cloud-storage requirement; see **docs/MCP_ARCHITECTURE.md**.

          ### Raw rich evidence is canonical
          The canonical workflow trace now preserves privacy-hardened event metadata and stable event IDs so an AI can reconstruct work directly from observed evidence. Browser/tab context, safe control semantics, semantic-action hints, copy/paste transfer linkage and effort/timing metadata remain available when observed. Inferred tasks/process families remain regeneratable hints, not ground truth.

          ### Enterprise data-plane controls
          Device write credentials and integration read credentials are separate and revocable. Gateway queries are tenant-scoped. Event identity is scoped by organization. Organization/actor/device identity comes from the authenticated endpoint credential rather than uploaded JSON. Endpoint policy can only be narrowed by organization policy, not broadened. Sharing can be paused independently of local capture.

          Typed text, ordinary key identities, clipboard contents and screenshot bytes are outside the Gateway contract and are rejected/not synchronized.

          ### macOS / Windows testers
          Download **OpenWorkGraph-macOS.zip** or **OpenWorkGraph-Windows.zip** from this release. The standalone desktop product remains usable without the Gateway. **AI_GUIDE.md** and **PROMPT.md** are included.

          ### Claude Desktop
          **OpenWorkGraph-Claude.mcpb** remains a small local stdio MCP wrapper for an existing OpenWorkGraph installation. Local AI access starts OFF on each OpenWorkGraph launch and can be disabled from the local dashboard.

          ### Security note
          Self-hosted production deployments should use customer-controlled TLS/network access, secret management, retention/backups and identity infrastructure appropriate to their environment. The v0.53 Gateway data plane uses explicit device/service credentials and can sit behind an organization OAuth/OIDC-aware access proxy; native SSO/SCIM provisioning is not required for the core self-hosted data plane.
          EOF

          gh release create "$TAG" \
            release-assets/OpenWorkGraph-macOS.zip \
            release-assets/OpenWorkGraph-macOS.zip.sha256 \
            release-assets/OpenWorkGraph-Windows.zip \
            release-assets/OpenWorkGraph-Windows.zip.sha256 \
            release-assets/OpenWorkGraph-Claude.mcpb \
            --target "$GITHUB_SHA" \
            --title "OpenWorkGraph ${TAG}" \
            --notes-file /tmp/openworkgraph-release-notes.md
