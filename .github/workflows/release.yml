name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh
      - name: Build offline macOS menu-bar app
        run: bash scripts/build_macos_app_bundle.sh
      - name: Ad-hoc sign and verify app bundle shape
        run: |
          set -euo pipefail
          codesign --force --deep --sign - dist/OpenWorkGraph.app
          codesign --verify --deep --strict --verbose=2 dist/OpenWorkGraph.app
          test -x dist/OpenWorkGraph.app/Contents/MacOS/OpenWorkGraph
          PAYLOAD="$PWD/dist/OpenWorkGraph.app/Contents/Resources/openworkgraph"
          PYTHON_RELATIVE="$(tr -d '\r\n' < "$PAYLOAD/EMBEDDED_PYTHON.txt")"
          test -n "$PYTHON_RELATIVE"
          test -x "$PAYLOAD/$PYTHON_RELATIVE"
          test -f "$PAYLOAD/OFFLINE_RUNTIME"
          plutil -lint dist/OpenWorkGraph.app/Contents/Info.plist
      - name: Build clickable macOS installer
        run: bash scripts/build_macos_installer_pkg.sh
      - name: Smoke-test embedded macOS runtime with stable user state
        run: |
          set -euo pipefail
          PAYLOAD="$PWD/dist/OpenWorkGraph.app/Contents/Resources/openworkgraph"
          PYTHON_RELATIVE="$(tr -d '\r\n' < "$PAYLOAD/EMBEDDED_PYTHON.txt")"
          PYTHON="$PAYLOAD/$PYTHON_RELATIVE"
          "$PYTHON" -c "import fastapi, mcp; import server.secure_app, collector.main"

          export HOME="$RUNNER_TEMP/owg-macos-app-home"
          INSTALL="$HOME/Library/Application Support/WorkflowObserver"
          mkdir -p "$HOME"

          sync_payload() {
            mkdir -p "$INSTALL"
            /usr/bin/rsync -a --delete \
              --exclude '.venv/' \
              --exclude '.runtime/' \
              --exclude '.pytest_cache/' \
              --exclude '__pycache__/' \
              --exclude 'data/' \
              --exclude 'config.json' \
              "$PAYLOAD/" "$INSTALL/"
          }

          launch_demo() {
            label="$1"
            sync_payload
            (
              cd "$INSTALL"
              "$PYTHON" "$INSTALL/start.py" --mode demo
            ) >"$RUNNER_TEMP/owg-$label.log" 2>&1 &
            pid=$!
            ok=0
            for _ in $(seq 1 90); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/owg-$label.log"
                echo "$label embedded app launch exited early" >&2
                exit 1
              fi
              if /usr/bin/curl --silent --fail http://127.0.0.1:8787/health | /usr/bin/grep -q '"status":"ok"'; then
                ok=1
                break
              fi
              sleep 1
            done
            if [[ "$ok" != "1" ]]; then
              cat "$RUNNER_TEMP/owg-$label.log"
              echo "$label embedded app launch never reached health" >&2
              exit 1
            fi
            /usr/bin/pkill -TERM -P "$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 2
            /usr/bin/pkill -KILL -P "$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
          }

          launch_demo first
          test -f "$INSTALL/config.json"
          mkdir -p "$INSTALL/data/live"
          printf 'preserve-me\n' > "$INSTALL/data/live/desktop-installer-smoke.txt"
          launch_demo second
          grep -q 'preserve-me' "$INSTALL/data/live/desktop-installer-smoke.txt"
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
            dist/OpenWorkGraph-macOS-v*.pkg
            dist/OpenWorkGraph-macOS-v*.pkg.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Parse enterprise PowerShell deployment scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($Path in @(
            "platform\enterprise\windows\install-managed.ps1",
            "platform\enterprise\windows\detect.ps1",
            "scripts\build_windows_enterprise_installer.ps1"
          )) {
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $Path),
              [ref]$null,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error "${Path}: $($_.Message)" }
              throw "PowerShell parse failed: $Path"
            }
          }
      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1
      - name: Embed offline runtime for installer
        shell: powershell
        run: ./scripts/embed_windows_runtime.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build unsigned offline installer
        shell: powershell
        run: ./scripts/build_windows_installer.ps1
      - name: Build machine-wide enterprise installer
        shell: powershell
        run: ./scripts/build_windows_enterprise_installer.ps1
      - name: Smoke-test installed offline runtime twice
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Version = (Get-Content VERSION -Raw).Trim()
          $Installer = (Resolve-Path "dist\OpenWorkGraph-Windows-Setup-v$Version.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "owg-installed"
          Remove-Item $InstallDir -Recurse -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$InstallDir", "/MERGETASKS=!startup" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
          $Payload = Join-Path $InstallDir ".openworkgraph-src"
          $PythonwRelative = (Get-Content (Join-Path $Payload "EMBEDDED_PYTHONW.txt") -Raw).Trim()
          $Pythonw = Join-Path $Payload $PythonwRelative
          $Python = Join-Path (Split-Path $Pythonw -Parent) "python.exe"
          if (-not (Test-Path $Python) -or -not (Test-Path $Pythonw) -or -not (Test-Path (Join-Path $Payload "OFFLINE_RUNTIME"))) {
            throw "Offline runtime is missing from installed payload"
          }
          & $Python -c "import fastapi, mcp, pystray, win32com.client, uiautomation"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime import smoke failed" }

          function Launch-Demo([string]$label) {
            $app = Start-Process -FilePath $Python -ArgumentList "start.py", "--mode", "demo" -WorkingDirectory $Payload -PassThru -WindowStyle Hidden
            try {
              $ok = $false
              for ($i=0; $i -lt 90; $i++) {
                if ($app.HasExited) { throw "$label offline launch exited early: $($app.ExitCode)" }
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:8787/health" -TimeoutSec 2
                  if ($health.status -eq "ok") { $ok = $true; break }
                } catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $ok) { throw "$label offline launch never reached health" }
            } finally {
              $rootProcessId = $app.Id
              # Windows may report that a child vanished mid-taskkill even
              # though cleanup succeeded. Suppress that race, then verify the
              # service itself is no longer reachable before the next launch.
              & cmd.exe /d /c "taskkill.exe /PID $rootProcessId /T /F >nul 2>&1" | Out-Null
              for ($j=0; $j -lt 20; $j++) {
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:8787/health" -TimeoutSec 1
                  Start-Sleep -Milliseconds 500
                } catch {
                  break
                }
              }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8787/health" -TimeoutSec 1
                throw "$label offline launch remained reachable after cleanup"
              } catch [System.Net.WebException] {
                # Expected: the listener is gone.
              }
            }
          }
          Launch-Demo "first"
          Launch-Demo "second"

      - name: Smoke-test machine-wide enterprise installer and per-user mirror
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Version = (Get-Content VERSION -Raw).Trim()
          $Installer = (Resolve-Path "dist\OpenWorkGraph-Windows-Enterprise-Setup-v$Version.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "owg-enterprise-installed"
          $UserRoot = Join-Path $env:RUNNER_TEMP "owg-enterprise-user"
          Remove-Item $InstallDir,$UserRoot -Recurse -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$InstallDir","/MERGETASKS=!startup" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Enterprise installer exited with $($proc.ExitCode)" }

          $Payload = Join-Path $InstallDir ".openworkgraph-src"
          $PythonwRelative = (Get-Content (Join-Path $Payload "EMBEDDED_PYTHONW.txt") -Raw).Trim()
          $Python = Join-Path (Split-Path (Join-Path $Payload $PythonwRelative) -Parent) "python.exe"
          if (-not (Test-Path $Python)) { throw "Enterprise embedded Python missing" }

          $env:LOCALAPPDATA = $UserRoot
          $env:OWG_ENTERPRISE_PAYLOAD = $Payload
          & $Python -c "import os,sys,pathlib; p=pathlib.Path(os.environ['OWG_ENTERPRISE_PAYLOAD']); sys.path.insert(0,str(p)); import windows_tray; windows_tray.PAYLOAD_ROOT=p; t=windows_tray._prepare_machine_runtime(); assert (t/'start.py').is_file(); assert not (t/'.runtime').exists(); print(t)"
          if ($LASTEXITCODE -ne 0) { throw "Enterprise per-user mirror smoke failed" }
          if (-not (Test-Path (Join-Path $UserRoot "OpenWorkGraph\Runtime\start.py"))) { throw "Per-user enterprise runtime was not created" }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
            dist/OpenWorkGraph-Windows-Setup-v*.exe
            dist/OpenWorkGraph-Windows-Setup-v*.exe.sha256
            dist/OpenWorkGraph-Windows-Enterprise-Setup-v*.exe
            dist/OpenWorkGraph-Windows-Enterprise-Setup-v*.exe.sha256
          if-no-files-found: error

  enterprise-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse enterprise deployment tooling
        run: |
          python -m py_compile scripts/build_enterprise_release.py platform/enterprise/health/fleet_health.py
          bash -n platform/enterprise/macos/install-managed.sh
      - name: Build browser sensor and enterprise deployment kit
        run: python scripts/build_enterprise_release.py
      - name: Verify enterprise release contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          version = Path("VERSION").read_text().strip()
          browser = Path(f"dist/OpenWorkGraph-Browser-Sensor-v{version}.zip")
          kit = Path(f"dist/OpenWorkGraph-Enterprise-Deployment-Kit-v{version}.zip")
          with zipfile.ZipFile(browser) as z:
              names = set(z.namelist())
              assert {"manifest.json", "popup.html", "popup.js", "secure_background.js"} <= names
              assert "pairing.json" not in names
          with zipfile.ZipFile(kit) as z:
              names = set(z.namelist())
              assert "enterprise/README.md" in names
              assert "enterprise/windows/install-managed.ps1" in names
              assert "enterprise/macos/install-managed.sh" in names
              assert "enterprise/FLEET_ACCEPTANCE.md" in names
          PY
      - name: Upload enterprise assets
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Enterprise
          path: |
            dist/OpenWorkGraph-Browser-Sensor-v*.zip
            dist/OpenWorkGraph-Browser-Sensor-v*.zip.sha256
            dist/OpenWorkGraph-Enterprise-Deployment-Kit-v*.zip
            dist/OpenWorkGraph-Enterprise-Deployment-Kit-v*.zip.sha256
          if-no-files-found: error

  mcpb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Claude Desktop MCP bundle
        run: python scripts/build_mcpb.py
      - name: Check MCP bundle contents
        run: |
          python - <<'PY'
          import zipfile
          p = 'dist/OpenWorkGraph-Claude.mcpb'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          assert {'manifest.json', 'server/index.js'} <= names, names
          PY
      - name: Smoke-test packaged Claude MCP bundle
        run: python scripts/smoke_mcpb.py dist/OpenWorkGraph-Claude.mcpb
      - name: Upload Claude MCP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: dist/OpenWorkGraph-Claude.mcpb
          if-no-files-found: error

  sdk-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate standalone custom-agent SDKs
        run: |
          python -m py_compile sdk/python/openworkgraph_agent.py
          node --check sdk/typescript/index.mjs
      - name: Stage standalone custom-agent SDK assets
        run: |
          mkdir -p dist
          cp sdk/python/openworkgraph_agent.py dist/OpenWorkGraph-Agent-Python.py
          cp sdk/typescript/index.mjs dist/OpenWorkGraph-Agent-Node.mjs
          cp sdk/typescript/index.d.ts dist/OpenWorkGraph-Agent-Node.d.ts
      - name: Upload custom-agent SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-agent-sdk
          path: |
            dist/OpenWorkGraph-Agent-Python.py
            dist/OpenWorkGraph-Agent-Node.mjs
            dist/OpenWorkGraph-Agent-Node.d.ts
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package, enterprise-package, mcpb-package, sdk-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets
      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets
      - name: Download Claude MCP bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: release-assets
      - name: Download custom-agent SDK assets
        uses: actions/download-artifact@v4
        with:
          name: pkg-agent-sdk
          path: release-assets
      - name: Download enterprise assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Enterprise
          path: release-assets
      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          cp install.sh install.ps1 uninstall.sh uninstall.ps1 release-assets/

          MAC_VERSIONED="$(find release-assets -maxdepth 1 -type f -name 'OpenWorkGraph-macOS-v*.pkg' ! -name '*.sha256' | head -n 1)"
          WIN_VERSIONED="$(find release-assets -maxdepth 1 -type f -name 'OpenWorkGraph-Windows-Setup-v*.exe' | head -n 1)"
          WIN_ENTERPRISE_VERSIONED="$(find release-assets -maxdepth 1 -type f -name 'OpenWorkGraph-Windows-Enterprise-Setup-v*.exe' | head -n 1)"
          BROWSER_VERSIONED="$(find release-assets -maxdepth 1 -type f -name 'OpenWorkGraph-Browser-Sensor-v*.zip' | head -n 1)"
          ENTERPRISE_KIT_VERSIONED="$(find release-assets -maxdepth 1 -type f -name 'OpenWorkGraph-Enterprise-Deployment-Kit-v*.zip' | head -n 1)"
          test -n "$MAC_VERSIONED" && test -f "$MAC_VERSIONED"
          test -n "$WIN_VERSIONED" && test -f "$WIN_VERSIONED"
          test -n "$WIN_ENTERPRISE_VERSIONED" && test -f "$WIN_ENTERPRISE_VERSIONED"
          test -n "$BROWSER_VERSIONED" && test -f "$BROWSER_VERSIONED"
          test -n "$ENTERPRISE_KIT_VERSIONED" && test -f "$ENTERPRISE_KIT_VERSIONED"
          cp "$MAC_VERSIONED" release-assets/OpenWorkGraph-macOS.pkg
          cp "$WIN_VERSIONED" release-assets/OpenWorkGraph-Windows-Setup.exe
          cp "$WIN_ENTERPRISE_VERSIONED" release-assets/OpenWorkGraph-Windows-Enterprise-Setup.exe
          cp "$BROWSER_VERSIONED" release-assets/OpenWorkGraph-Browser-Sensor.zip
          cp "$ENTERPRISE_KIT_VERSIONED" release-assets/OpenWorkGraph-Enterprise-Deployment-Kit.zip
          sha256sum release-assets/OpenWorkGraph-macOS.pkg > release-assets/OpenWorkGraph-macOS.pkg.sha256
          sha256sum release-assets/OpenWorkGraph-Windows-Setup.exe > release-assets/OpenWorkGraph-Windows-Setup.exe.sha256
          sha256sum release-assets/OpenWorkGraph-Windows-Enterprise-Setup.exe > release-assets/OpenWorkGraph-Windows-Enterprise-Setup.exe.sha256
          sha256sum release-assets/OpenWorkGraph-Browser-Sensor.zip > release-assets/OpenWorkGraph-Browser-Sensor.zip.sha256
          sha256sum release-assets/OpenWorkGraph-Enterprise-Deployment-Kit.zip > release-assets/OpenWorkGraph-Enterprise-Deployment-Kit.zip.sha256

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is local-first, open-source context infrastructure for how human and AI-agent work actually happens.

          ### v0.122: enterprise productization and simpler browser setup

          - **Enterprise Deployment Kit:** release assets now include repeatable Jamf/Intune scripts, managed enrollment templates, browser policy templates, fleet acceptance checks and Gateway health tooling.
          - **Machine-wide Windows enterprise package:** a separate admin installer places immutable runtime code under Program Files, starts from HKLM at sign-in and mirrors mutable OpenWorkGraph source/state into each user's LocalAppData.
          - **Browser sensor distribution:** releases publish a store-ready browser sensor ZIP, while enterprise policy templates are ready for the real Chrome/Edge store extension ID after publisher review.
          - **One-click browser pairing:** the extension can open an explicit localhost approval page and receive a one-time approved local credential; the 8-digit code remains fallback only.
          - **Managed config fallback:** system-managed configuration wins, with a per-user fallback for Intune/User-context and no-admin pilots.
          - **MDM owns enterprise upgrades:** endpoint release checks never silently replace IT-managed binaries.
          - **No silent trust claims:** Apple/Windows signing and browser-store publication remain credential-bound production gates and are documented as such.

          ### v0.121: reliable desktop continuity

          - **macOS starts again after login:** the menu-bar app registers itself with Apple's Service Management login-item API on first v0.121+ launch. Users can turn **Start OpenWorkGraph at Login** off or back on from the OWG menu; external System Settings choices are not silently reversed.
          - **Windows keeps its existing start-at-sign-in default:** the native installer still creates the current-user startup entry unless the installer option is explicitly disabled.
          - **Unexpected child-process exits recover:** the macOS menu app and Windows tray host restart the observer with bounded exponential backoff instead of silently disappearing after one crash.
          - **Intentional Quit stays quit:** manual Quit/Restart clears ownership before terminating the child, so crash supervision cannot resurrect a process the user deliberately stopped.
          - **Crash-loop protection:** automatic recovery pauses after five unexpected exits in five minutes and surfaces a visible diagnostic instead of spinning forever.
          - **No evidence or privacy-model change:** local data paths, capture semantics, retention, MCP, Gateway and browser evidence remain unchanged.

          ### v0.120: real desktop installers

          - **No ZIP or terminal for normal users:** GitHub Releases now publish stable **OpenWorkGraph-macOS.pkg** and **OpenWorkGraph-Windows-Setup.exe** assets intended for direct website download.
          - **Offline runtime included:** both desktop installers include the private Python runtime and dependencies, so users do not install Python or wait for a first-run runtime download.
          - **Same local state:** the macOS app keeps its signed runtime sealed inside the app bundle while syncing source into the established user Library installation and preserving **data/** and **config.json**; Windows keeps its established per-user LocalAppData install.
          - **Advanced paths remain:** release-matched shell installers and tester ZIPs remain available for technical users and troubleshooting.
          - **Signing-ready:** the normal release produces usable unsigned early-prototype installers; the existing signing workflow can produce notarized macOS and signed Windows variants when signing credentials are configured.
          - **No capture semantics change:** collection, evidence schema, privacy controls, MCP, Gateway, exports and agent integrations are unchanged.

          ### v0.119: easier local installation without a second runtime

          - **Release-matched bootstrap installers:** install.sh and install.ps1 ship as release assets and are pinned to the same v0.119 package instead of mixing main-branch installer code with a different latest-release ZIP.
          - **Normal places to reopen:** the macOS bootstrap adds OpenWorkGraph to the current user's Applications folder; Windows adds a current-user Start-menu shortcut. Both delegate to the established per-user installation rather than owning a second runtime or data directory.
          - **Installer smoke coverage:** CI now runs the real bootstrap against the freshly built ZIP on macOS and Windows, checks local health, relaunches through the generated app/shortcut, and exercises uninstall.
          - **Explicit uninstall:** release assets include uninstall helpers that require confirmation before deleting the local runtime, configuration and evidence, and refuse to proceed while port 8787 is in use.
          - **No capture semantics change:** collectors, local databases, MCP, Gateway, browser evidence, privacy behavior and agent integrations are unchanged.

          ### v0.118: Basic and Advanced views, one Privacy tab

          - **Basic by default:** four tabs (Today, Activity, AI apps, Privacy). Agents and Organization appear as soon as they are in use. The Advanced switch in the top bar shows every tab and setting; nothing was removed.
          - **One Privacy tab:** recording, how long history is kept, AI access, older-history access, name hiding, browser detail, never-record lists and delete, in one place.
          - **Never record, now visible:** apps, websites and words in a window title can be edited in the dashboard and apply to new activity immediately, without restarting the recorder. The default password-manager and title list can be restored.
          - **One retention choice:** "This session only" now also turns off the small run summaries, so it keeps nothing after the session.
          - **AI access is remembered:** still off on a new install and checked on every MCP call; your choice now survives a restart unless you turn on "Turn AI access off every time OpenWorkGraph starts".
          - **Clearer first run:** one status line and a three-step setup checklist replace the stacked first-run cards; summary exports by default; no misleading sharing table when no organization is connected; stale dashboard tabs explain how to reopen.
          - **Calmer look:** segmented tabs, softer cards, one type scale and consistent switches, at desktop and phone width.

          ### v0.117: a clearer, calmer dashboard

          - **Today's timeline shows again:** a first-run helper hid the timeline card before it loaded and never showed it again. The card now stays visible with loading and empty states.
          - **Evidence keeps its context:** the Evidence table shows the stored page or window title, the same context exports keep, with detected names, email addresses, phone numbers and personal numbers as tokens. Detection is best effort; a second redaction pass runs before display truncation and fails closed; URL paths and raw button labels are still never sent to the dashboard.
          - **Human views show human work:** agent runs stay on the Agents tab and no longer appear in Evidence or the Work profile. Playbooks follow the same hide-disconnected-agents choice as the Agents tab.
          - **One place for AI access:** a single AI access switch in Connect with a plain summary of what AI apps can read, including saved history. The duplicate Enable button is gone; that card is now a read-only Recent AI activity log.
          - **Settings tab:** capture and privacy settings, browser sensor pairing and learned names moved out of Organization, which now only covers joining and sharing with an organization.
          - **Plain language and calmer controls:** internal terms and keys are replaced with plain labels, single settings are switches that save immediately, delete buttons are quiet until confirmed, and form controls share one style.
          - **Lighter and phone-friendly:** dashboard status refreshes every 5 seconds instead of every second, only while visible; the tab bar shows that it scrolls on small screens and Work profile tiles use two columns.
          - **No capture or sensor change:** browser sensor 1.14.0 remains current; capture, storage, MCP and Gateway behavior are unchanged.

          ### v0.116: evidence-first workflow skill drafting

          - **Evidence, not inferred truth:** get_workflow_evidence packages explicitly selected observed executions, provenance and bounded canonical evidence. Derived workflow families and support counts remain navigation/descriptive indexes, never semantic ground truth.
          - **One clear AI path:** users review the concrete runs that belong together, then a connected external AI can fetch the same evidence over MCP or the user can export it. OpenWorkGraph does not contain a skill-authoring model and does not silently create or execute a skill.
          - **Redacted-first sharing:** dashboard exports default to Redacted. Stored means the locally persisted privacy-hardened representation, never pre-privacy capture, and is a deliberate secondary export choice.
          - **No authorization from history:** repeated actions, dominant paths, approvals, saves or sends do not establish policy, permission or business intent. Connected AI is instructed to ask for missing business rules, source-of-truth decisions, escalation criteria and approval boundaries.
          - **Modern automation rather than click replay:** the drafting guide tells the AI to prefer current authorized APIs/connectors/tools when they can achieve the same outcome, and never to invent clipboard values or absent payloads.
          - **Authenticated local export:** workflow-evidence ZIP downloads keep the existing protected /v1 boundary; the dashboard uses its authenticated session to fetch the archive before downloading it.
          - **Compact MCP stays synchronized:** the default compact surface now has 13 tools, including get_workflow_evidence; the MCPB manifest, smoke test and architecture docs assert the same exact surface while the legacy 24-tool compatibility entrypoint remains available.

          ### v0.115: human-first demo and distribution refresh

          - **Ordinary human workflows remain the core product:** OpenWorkGraph records desktop/browser work without an AI agent. AI agent observation is an optional additional evidence stream, not a prerequisite for capture.
          - **Human-first synthetic demo:** the primary demo now contains three repeated Gmail → Salesforce → Google Sheets → Salesforce → Gmail human workflows with timing, browser semantic evidence, installation-keyed Context-mode object correlation and content-free copy/paste linkage.
          - **Agent example is visibly separate:** one later human+agent coding example uses the real structural agent-ingest contract so testers can compare human-only evidence with optional agent telemetry instead of conflating them.
          - **Same private runtime for live and demo:** macOS and Windows demo launchers delegate to the same installer/runtime path as normal observation; the stale Windows Python prerequisite and old Workflow Observer setup wording are gone.
          - **Demo ships in the ZIPs:** release packages now include **TRY_DEMO_OPENWORKGRAPH.command** on macOS and **TRY_DEMO_OPENWORKGRAPH.cmd** on Windows alongside the normal START_OPENWORKGRAPH launcher.
          - **No unnecessary browser bump:** browser sensor 1.14.0 remains current because v0.115 changes demo/distribution code, not the browser capture protocol.

          ### v0.114: configurable browser context with keyed correlation

          - **Privacy remains configurable:** Privacy-first keeps business-object references off and now masks known SaaS object-ID positions in stored browser paths; Context correlates repeated work with an installation-keyed token; Rich enterprise explicitly opts into minimal validated provider locators for authorized connector resolution.
          - **Allowlisted object references:** Google Docs/Sheets/Slides/Drive, known Gmail conversation routes, GitHub PR/issues, Salesforce records, Jira issues and Linear issues can be recognized without storing full URLs, query values, fragments or page contents.
          - **Two keyed persistence boundaries:** the browser durable queue uses an HMAC keyed by the browser-pairing secret, and the local server replaces that fingerprint with a second HMAC keyed by the installation API secret before database persistence. Short Jira keys or PR numbers cannot be recovered by enumerating plain hashes from the stored token.
          - **Exclusions still fail closed:** configured host/title exclusions are checked before an optional Rich enterprise locator can enter the extension retry queue, and the server applies policy again at ingest.
          - **Browser sensor update notice:** the v1.14 browser sensor is version-checked by the local server; the dashboard tells unpacked-extension users to reload when an older sensor is still running. Existing capture continues while new v0.114 browser-context features wait for the current sensor.
          - **No platform expansion hidden in the release:** native macOS/Windows active-URL capture and enterprise content connectors remain separate future work; existing desktop/browser/agent/MCP/Gateway behavior stays intact.

          ### v0.113: frontier-aware automation interpretation

          - **Compact evidence keeps work identity:** compact MCP workflow rows retain a bounded protected work surface and title, so browser-heavy work can remain distinguishable as Gmail, Salesforce, Sheets, and similar surfaces without exposing rich metadata.
          - **Missing historical payload is not future infeasibility:** absent email bodies, clipboard contents, typed text or spreadsheet cells no longer imply that a future automation is blocked; connected AI is told to check whether an authorized agent can retrieve the live input from the source system at execution time.
          - **Redesign before click imitation:** automation analysis considers eliminating a step, deterministic automation, agent delegation, agent plus approval, or human-only work. A proposed removal must first check managers, reports, controls or downstream teams that may consume the output.
          - **Find the next autonomy boundary:** when an agent already performs part of a workflow, connected AI is told to inspect the human work before, between and after agent runs rather than recommending automation of work the agent already does.
          - **Capability map before rejection:** required operations are separated into confirmed, plausible/testable and blocked rather than treating not-observed as unavailable.
          - **Consequence-aware autonomy:** low-impact reversible work may later use scoped standing authorization when policy permits, while financial, regulated, clinical, irreversible, safety-critical or otherwise high-impact actions retain the appropriate human or organizational control. Repetition alone is not permission.
          - **Measured interpretation quality:** a fixed six-case evaluation corpus and scorer track both automation underestimation and overreach, including macro-only recommendations, missing-payload pessimism, agent-orchestration blind spots, unjustified financial/clinical autonomy and invented automation for one-off work.

          ### v0.112: trustworthy AI answers and agent-run accounting

          - **One Claude run, not two:** Claude Code hooks/OTel and native-session fallback now share one opaque cross-sensor identity. Prompt turns stay inside the physical session while genuine subagents keep separate opaque child executions, and matching tool calls are deduplicated by opaque tool identity instead of timestamp proximity alone.
          - **Truthful test outcomes:** passing, failing and unknown test runs stay distinct. Missing result evidence never becomes a confident zero failures; a later observed passing test can resolve an otherwise-unknown run outcome without erasing the earlier observed failure.
          - **Token usage is evidence, not an estimate:** exact provider/SDK usage is reported as observed. Runtimes that do not expose usage are reported as not observed with a basis; OpenWorkGraph does not infer tokens from visible text.
          - **Smaller MCP evidence pages:** get_workflow_trace is compact by default and keeps stable pagination; authorized rich rows remain available explicitly. Aggregate saved-history errors name the exact History grant or date-range alternative.
          - **Better default scopes:** after a launcher restart, work-profile/context tools can fall back to authorized local today evidence rather than returning a misleading empty current-session answer.
          - **Readable repeated work:** repeated-workflow candidates expose readable typical steps and retain engaged and foreground evidence, using foreground duration only as an explicit fallback when engagement is zero or unobserved.
          - **Native sensor health:** clean bootstrap/cleanup no longer increments the error counter; bounded last_error reports only real failure stage/type without paths or provider payloads.

          ### v0.111: provenance-safe agent Working Detail

          - Working Detail is OFF by default and lives outside the canonical event stream, with separate capture and connected-AI read controls.
          - Working Detail preserves bounded workspace-relative file, command, test, failure, and repository-state facts without persisting raw tool output, arbitrary shell arguments, absolute paths, prompts, messages, or hidden reasoning.
          - Existing session handoff can include bounded Working Detail only when AI read permission is enabled; no new compact MCP tool is added and Gateway sharing is unchanged.
          - Enabling Working Detail starts at the end of existing native history. Import last 7 days is a separate explicit action that parses historical result text in memory and stores only privacy-hardened structured facts.
          - Test outcomes remain tri-state. Missing result evidence stays unknown, and zero observed failures never becomes proof that all tests passed.

          ### v0.110: evidence-first MCP guidance and safer first-run history
          This release ships the frontier-aware automation behavior already merged on main and makes the compact MCP tell connected models how to use the evidence surface rather than hoping they discover optional prompts/resources on their own.

          - **MCP initialize guidance:** compact local MCP clients now receive short server instructions that keep raw workflow evidence primary, require paging through get_workflow_trace when a whole period matters, and direct automation questions to the dated capability resource.
          - **Current automation frontier:** models are told to inspect the tools actually available to them, consider agentic browser/computer use, connectors/MCP, files, code, scheduling and approval checkpoints, and classify plausible-but-uncertain opportunities as TEST rather than dismissing them.
          - **Packaged MCPB smoke test:** CI now extracts the built Claude Desktop bundle, validates its v0.110 manifest and exact 12-tool compact surface, syntax-checks the packaged Node launcher and verifies its OpenWorkGraph launcher markers.
          - **First-run retention grace:** genuinely undecided new users keep human and agent history locally for up to 7 days while the retention card keeps asking. Explicit Don't keep after sessions remains ephemeral, upgrades keep their prior history behavior, and saved-history AI access remains a separate OFF-by-default permission.
          - **Documentation sync:** the MCP architecture now documents the complete compact surface, including Context Pulse and History navigation.

          ### v0.109: native agent session continuity
          OpenWorkGraph can now observe supported local agent sessions directly and provide a grounded handoff between agents without turning transcripts into canonical workflow evidence.

          - **Native session observation:** Claude Code and Codex session files can feed privacy-minimized structural evidence into the existing agent-run model. First enable starts new-only rather than silently backfilling old sessions, and richer hook/SDK/OTel evidence remains preferred when available.
          - **Separate message layer:** visible user/assistant messages are OFF by default and live in a separate local store when explicitly enabled. Hidden reasoning/thinking, raw provider records and tool outputs are not retained as session continuity content.
          - **Grounded cross-agent handoff:** the compact MCP surface adds get_agent_handoff, combining bounded optional visible messages with matching canonical structural execution evidence and explicit provenance/grounding semantics.
          - **Independent privacy controls:** message capture, connected-AI message reads, retention and organization sharing are separate choices. Existing Context/Observe/Brief settings do not silently grant transcript access.
          - **Organization sharing:** agent-session messages do not inherit allow_agent_events. Upload requires endpoint opt-in allow_gateway_session_messages, organization opt-in allow_agent_session_messages and a device credential with agent-sessions:write; reads separately require agent-sessions:read. Existing device credentials are not silently broadened after upgrade, local restriction wins, and a separate sync cursor prevents later opt-in from backfilling older saved messages.
          - **Transcript lifecycle:** shared session messages obey the organization's retention immediately at read time and during physical cleanup/purge. Oversized native JSONL records are skipped in bounded chunks so one malformed/giant provider record cannot pin observation of later session activity.

          ### v0.108: full context, personal details tokenized
          Titles keep their context; only detected personal details are replaced.

          - **Titles, labels and paths keep their text:** browser tabs and desktop apps alike. Detected names, email addresses, phone numbers, personal identity numbers, IBANs, payment cards and credentials become stable tokens before storage, for example **Re: Contract renewal Q4 - PERSON_x - Gmail**. Company, product and project names and business references stay. Name detection is best effort; review exports before external sharing.
          - **Upgrade:** evidence stored earlier is protected once in the background, in checkpointed batches; only rows with a detected personal detail are rewritten.
          - **Exports:** redacted by default, with copy that says what the file keeps.
          - **First use:** the first reconstruction comes before the retention choice; Connect lists detected apps first with Context, Observe and Brief switches; agent-learning features moved to the Agents tab; friendly surface names throughout; OpenWorkGraph launcher wording; current macOS Gatekeeper and Windows SmartScreen steps; a rewritten testing guide.

          ### Since v0.107: the agent learning loop
          This release turns structural observation into a bounded learning loop without making inferred summaries the source of truth. Canonical evidence remains primary.

          - **Run memory:** content-free structural run summaries can survive raw-history retention. Existing installations whose human and agent history were both explicitly ephemeral do not silently gain persistent run memory on upgrade.
          - **Outcome tracking:** optional github.com pull-request and CI outcomes are polled through the user's local gh login. Tool-provided arbitrary hosts cannot become network targets, and watch timing follows the observed work event rather than delayed ingestion.
          - **Session briefs:** optional Claude Code SessionStart briefs feed bounded structural facts from prior runs back into the agent. Unknown test results remain unknown; OpenWorkGraph does not invent zero pass/fail counts.
          - **Human + agent join:** coarse human activity can be aligned around agent runs. Rework overlap refers only to files edited by the immediately preceding turn, with cross-platform process locking for concurrent async hooks.
          - **Brief evaluation:** optional randomized holdout uses an explicit trial ID and sticky per-trial session assignment. Historical ordinary briefs are excluded, and open pull requests are right-censored from merge-rate denominators.
          - **Playbooks:** portable workflow summaries use strict canonical structural grammar. Prompt-like strings and device-local opaque refs are rejected at import and rechecked on read.
          - **Setup diagnostics:** Connect cards report specific evidence-based next steps without claiming an unobserved cause; telemetry actually observed remains the basis for active-state claims.

          ### First useful reconstruction
          The local dashboard includes an evidence-driven first-value layer that reconstructs the current session from existing privacy-hardened evidence. It adds no sensor, OS/browser permission, AI permission, retention permission, Gateway sharing, screenshot capture, filesystem watcher, prompt/response capture or content telemetry.

          ### Local-first remains the default
          A normal OpenWorkGraph install captures to local SQLite and provides local dashboard/export/API/MCP access without requiring an OpenWorkGraph account or hosted evidence store. Capture continues locally if an optional customer-controlled Gateway or network is unavailable.

          ### Human + agent execution evidence
          Human desktop/browser evidence and provider-neutral structural agent execution evidence coexist in the canonical local evidence store. Missing agent signals mean not observed, not proof that the runtime did not perform the action; hidden reasoning is not observed.

          ### Agent setup control plane
          The dashboard separates giving an AI access to OpenWorkGraph context from observing an agent's own execution. Setup material covers Claude Code hooks, Codex telemetry, OpenAI Agents tracing and generic structural adapters. OpenWorkGraph does not silently edit third-party configuration files. An integration is shown as active only when telemetry actually observed by the local evidence store supports that status.

          ### Custom harnesses
          Arbitrary agent harnesses can send structural telemetry with a dedicated write-only credential and separately read authorized context through MCP. The standalone helpers remain fail-open and do not accept or serialize prompt text, model responses, tool arguments/results, returned values, exception text or hidden reasoning. Release assets include **OpenWorkGraph-Agent-Python.py**, **OpenWorkGraph-Agent-Node.mjs** and **OpenWorkGraph-Agent-Node.d.ts** through the **pkg-agent-sdk** package job.

          ### Compact MCP for new connections
          New connections use the compact MCP surface. Existing saved configurations that explicitly launch the legacy secure server keep the **legacy 24-tool** compatibility surface. The compact surface includes **Readable procedural feedback** while preserving the **stable structural identity layer** underneath it.

          ### Explicit organization sharing
          Agent evidence is local-only by default even when Gateway synchronization is enabled for other evidence. The endpoint owner must explicitly opt in by setting gateway.local_policy.allow_agent_events=true; organization policy may narrow that choice but cannot broaden a local restriction.

          ### Exports
          JSON, CSV ZIP and XLSX exports include a **dedicated privacy-safe agent-run table** derived from canonical agent evidence. It uses opaque OpenWorkGraph references and does not expose native run/trace/span identifiers or agent content payloads.

          ### macOS / Windows installation
          Normal users should download **OpenWorkGraph-macOS.pkg** or **OpenWorkGraph-Windows-Setup.exe**. These include the offline runtime and install into the normal OS application locations. The ZIPs and shell installers remain available as advanced/tester fallbacks. **OpenWorkGraph-Claude.mcpb** provides the compact Claude Desktop MCP surface for an existing local installation.

          ### Security note
          Production/self-hosted deployments should still use customer-controlled TLS/network access, secret management, retention/backups, identity infrastructure and endpoint controls appropriate to their environment.
