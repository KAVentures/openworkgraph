name: tester-release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone macOS tester ZIP
        run: bash scripts/build_macos_release.sh

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: |
            dist/OpenWorkGraph-macOS.zip
            dist/OpenWorkGraph-macOS.zip.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone Windows tester ZIP
        shell: powershell
        run: ./scripts/build_windows_release.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: |
            dist/OpenWorkGraph-Windows.zip
            dist/OpenWorkGraph-Windows.zip.sha256
          if-no-files-found: error

  mcpb-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Claude Desktop MCP bundle
        run: python scripts/build_mcpb.py
      - name: Check MCP bundle contents
        run: |
          python - <<'PY'
          import zipfile
          p = 'dist/OpenWorkGraph-Claude.mcpb'
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          assert {'manifest.json', 'server/index.js'} <= names, names
          PY
      - name: Upload Claude MCP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: dist/OpenWorkGraph-Claude.mcpb
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos-package, windows-package, mcpb-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-macOS
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Windows
          path: release-assets

      - name: Download Claude MCP bundle
        uses: actions/download-artifact@v4
        with:
          name: OpenWorkGraph-Claude
          path: release-assets

      - name: Publish GitHub Release when VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
            echo "Bump VERSION to publish a new GitHub Release."
            exit 0
          fi

          cat > /tmp/openworkgraph-release-notes.md <<EOF
          ## OpenWorkGraph ${TAG}

          OpenWorkGraph is a local-first work-telemetry and organizational-context layer for AI.

          ### macOS tester
          Download **OpenWorkGraph-macOS.zip**, unzip it, then right-click **START_OPENWORKGRAPH.command → Open**. The package brings its own private runtime; no manual Python setup is required.

          ### Windows tester
          Download **OpenWorkGraph-Windows.zip**, unzip it, then double-click **START_OPENWORKGRAPH.cmd**. The launcher installs its own private runtime; no manual Python setup is required.

          For detailed browser/tab context, run the included **ADD_BROWSER_SENSOR** helper once and load the opened browser_extension folder as an unpacked extension.

          ### Claude Desktop
          **OpenWorkGraph-Claude.mcpb** is a small local desktop extension that launches the authenticated OpenWorkGraph stdio MCP server from an existing OpenWorkGraph installation. Install OpenWorkGraph first, then install the MCP bundle in Claude Desktop. AI access starts OFF on every OpenWorkGraph launch and must be enabled from the local dashboard.

          ### MCP behavior
          Local AI clients use stdio by default, so OpenWorkGraph no longer keeps a separate MCP HTTP port open during normal use. HTTP MCP starts only on demand for clients such as ChatGPT live connections that need a network transport. Rich workflow evidence is exposed through compact paginated traces rather than repeated full internal event objects.

          ### Privacy and local-interface security
          Typed text, individual key identities and clipboard contents are not captured. Screenshots are disabled in the normal configuration.

          High-confidence secrets and sensitive identifiers are hardened before local persistence where their literal value is not needed for workflow analysis. Presentation/API/MCP/export views additionally pseudonymize detected people/owner aliases. Rich workflow context such as company/project names, amounts, order/reference numbers and page/document titles may remain intentionally useful, so review rich exports before sharing them outside the intended analysis context.

          Local API reads/control routes are capability-protected. The browser sensor authenticates the local OpenWorkGraph server with HMAC challenge-response before sending browser evidence and signs sensor requests; if verification fails, pending browser evidence remains queued.

          These controls reduce accidental localhost exposure, unrelated-service probing and naive port squatting. They are not a security boundary against malware already running with the same operating-system user privileges; stronger protection for that attacker model requires OS/endpoint isolation and enterprise controls.

          Captured data stays local in this prototype unless the user explicitly exports it or enables an AI connection that requests evidence.
          EOF

          gh release create "$TAG" \
            release-assets/OpenWorkGraph-macOS.zip \
            release-assets/OpenWorkGraph-macOS.zip.sha256 \
            release-assets/OpenWorkGraph-Windows.zip \
            release-assets/OpenWorkGraph-Windows.zip.sha256 \
            release-assets/OpenWorkGraph-Claude.mcpb \
            --target "$GITHUB_SHA" \
            --title "OpenWorkGraph ${TAG}" \
            --notes-file /tmp/openworkgraph-release-notes.md
