name: signal-inbox-fast

on:
  pull_request:
    paths:
      - 'server/event_log_signal_inbox.py'
      - 'server/event_log_signals.py'
      - 'server/event_log_workspace.py'
      - 'server/event_log_routes.py'
      - 'tests/test_event_log_signal_inbox.py'
      - 'tests/test_signal_bulk_review.py'
      - '.github/workflows/signal-inbox-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its queued and running checks. Pushes to a
# branch share one group without cancel-in-progress: a running main build always finishes, and
# only the newest waiting one is kept. Manual runs get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signal-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: python -m pip install -e '.[dev,gateway]'
      - name: Test saved signal evaluation and manual review lifecycle
        run: |
          python -m pytest -q \
            tests/test_event_log_signal_inbox.py \
            tests/test_signal_bulk_review.py \
            tests/test_event_log_signals.py \
            tests/test_event_log_signal_evidence.py \
            tests/test_event_log_workspace.py
