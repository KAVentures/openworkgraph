name: Folder feed read-error acceptance
on:
  pull_request:
    paths:
      - 'server/event_log_folder_feeds.py'
      - 'dashboard/event_log_workspace.js'
      - 'tests/test_event_log_folder_feeds.py'
      - 'tests/browser/event_log_folder_feed_read_errors.cjs'
      - 'tests/browser/folder_feed_read_error_app.py'
      - 'tests/browser/process_logs_app.py'
      - '.github/workflows/folder-feed-read-errors.yml'
permissions:
  contents: read
jobs:
  folder-feed-read-error-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,gateway]'
      - run: python -m pytest -q tests/test_event_log_folder_feeds.py tests/test_event_log_append.py tests/test_local_scheduler.py
      - run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
      - run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/event_log_folder_feed_read_errors.cjs
