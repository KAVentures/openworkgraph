name: repair-v0107-landing

on:
  push:
    branches:
      - fix/v0107-landing

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge completed stack and resolve only release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/playbooks

          set +e
          git merge --no-ff --no-commit origin/feat/playbooks
          merge_rc=$?
          set -e

          expected=$(cat <<'EOF'
          VERSION
          mcpb/manifest.json
          pyproject.toml
          sdk/python/pyproject.toml
          sdk/typescript/package.json
          tests/test_release_version_v087.py
          EOF
          )
          expected="$(printf '%s\n' "$expected" | sed 's/^[[:space:]]*//' | sort)"
          unresolved="$(git diff --name-only --diff-filter=U | sort)"
          if [ "$unresolved" != "$expected" ]; then
            echo "Unexpected conflict set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          # Only release/version metadata conflicts. The completed v0.107 stack
          # is authoritative for those values; substantive code merged cleanly.
          git checkout --theirs -- \
            VERSION \
            mcpb/manifest.json \
            pyproject.toml \
            sdk/python/pyproject.toml \
            sdk/typescript/package.json \
            tests/test_release_version_v087.py
          git add \
            VERSION \
            mcpb/manifest.json \
            pyproject.toml \
            sdk/python/pyproject.toml \
            sdk/typescript/package.json \
            tests/test_release_version_v087.py

          test -z "$(git diff --name-only --diff-filter=U)"

          # Keep this one-off repair workflow out of the product tree.
          git rm .github/workflows/repair-v0107-landing.yml

          # Stable cross-stack checks. Full correctness is then enforced by the
          # normal PR test/package workflows on the exact integrated tree.
          test "$(tr -d '\r\n' < VERSION)" = "0.107.0"
          grep -q '_EDIT_TOOL_NAMES' server/agent_execution_traces.py
          grep -q 'response.failed' shared/codex_otel_adapter.py
          grep -q 'def pr_refs' shared/tool_detail.py
          grep -q '0.107.0' mcpb/manifest.json
          test -f server/outcome_tracker.py
          test -f server/agent_brief.py
          test -f server/brief_evaluation.py
          test -f server/playbooks.py
          test -f shared/workspace_rework.py
          test -f server/setup_checks.py

          python -m py_compile \
            server/agent_execution_traces.py \
            shared/codex_otel_adapter.py \
            shared/tool_detail.py \
            server/outcome_tracker.py \
            server/agent_brief.py \
            server/brief_evaluation.py \
            server/playbooks.py \
            shared/workspace_rework.py \
            server/setup_checks.py

          git commit -m "Integrate hardened v0.107 stack onto current main"
          git push origin HEAD:fix/v0107-landing
