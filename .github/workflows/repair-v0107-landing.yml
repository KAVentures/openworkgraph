name: repair-v0107-landing

on:
  push:
    branches:
      - fix/v0107-landing

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge completed stack and resolve only release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/playbooks

          set +e
          git merge --no-ff --no-commit origin/feat/playbooks
          merge_rc=$?
          set -e

          expected=$(cat <<'EOF'
          VERSION
          mcpb/manifest.json
          pyproject.toml
          sdk/python/pyproject.toml
          sdk/typescript/package.json
          tests/test_release_version_v087.py
          EOF
          )
          expected="$(printf '%s\n' "$expected" | sed 's/^[[:space:]]*//' | sort)"
          unresolved="$(git diff --name-only --diff-filter=U | sort)"
          if [ "$unresolved" != "$expected" ]; then
            echo "Unexpected conflict set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          # The only true conflicts are release/version metadata. The v0.107
          # stack is authoritative for these values.
          git checkout --theirs -- \
            VERSION \
            mcpb/manifest.json \
            pyproject.toml \
            sdk/python/pyproject.toml \
            sdk/typescript/package.json \
            tests/test_release_version_v087.py
          git add \
            VERSION \
            mcpb/manifest.json \
            pyproject.toml \
            sdk/python/pyproject.toml \
            sdk/typescript/package.json \
            tests/test_release_version_v087.py

          # Git must have cleanly three-way merged every substantive code file.
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Keep this one-off repair workflow out of the product tree.
          git rm .github/workflows/repair-v0107-landing.yml

          # Cross-stack invariants: final #105 hardening + #107-#112 additions.
          grep -qx '0.107.0' VERSION
          grep -q '_EDIT_TOOL_NAMES' server/agent_execution_traces.py
          grep -q 'test_status in {"passing", "failing", "unknown"}' server/agent_execution_traces.py
          grep -q 'def _run_material' server/agent_execution_traces.py
          grep -q 'human_context' server/agent_execution_traces.py
          grep -q 'response.failed' shared/codex_otel_adapter.py
          grep -q 'def _pr_watch' shared/codex_otel_adapter.py
          grep -q 'def pr_refs' shared/tool_detail.py
          grep -q 'test_status' shared/tool_detail.py
          grep -q 'github.com' server/outcome_tracker.py
          grep -q 'trial_id' server/agent_brief.py
          grep -q 'resolved' server/brief_evaluation.py
          grep -q '_valid_structural_step' server/playbooks.py
          grep -q 'class _Locked' shared/workspace_rework.py
          grep -q '0.107.0' mcpb/manifest.json

          git commit -m "Integrate hardened v0.107 stack onto current main"
          git push origin HEAD:fix/v0107-landing
