name: bounded-variant-preview

on:
  pull_request:
    paths:
      - "server/event_log_variant_preview.py"
      - "server/event_log_routes.py"
      - "tests/browser/variant_preview_app.py"
      - "tests/browser/process_logs_app.py"
      - "dashboard/event_log_workspace.js"
      - "tests/test_event_log_variant_coverage.py"
      - "docs/EVENT_LOG_VARIANT_PREVIEW.md"
      - "tests/test_event_log_variant_preview.py"
      - "tests/test_event_log_playback_filters.py"
      - "tests/browser/event_log_variant_preview.cjs"
      - ".github/workflows/bounded-variant-preview.yml"
  push:
    branches: ["main"]
    paths:
      - "server/event_log_variant_preview.py"
      - "server/event_log_routes.py"
      - "tests/browser/variant_preview_app.py"
      - "tests/browser/process_logs_app.py"
      - "dashboard/event_log_workspace.js"
      - "tests/test_event_log_variant_coverage.py"
      - "docs/EVENT_LOG_VARIANT_PREVIEW.md"
      - "tests/test_event_log_variant_preview.py"
      - "tests/test_event_log_playback_filters.py"
      - "tests/browser/event_log_variant_preview.cjs"
      - ".github/workflows/bounded-variant-preview.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-variant-preview-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local app and tests
        run: python -m pip install -e ".[dev,gateway]"
      - name: Exercise bounded and exact variant previews
        run: python -m pytest -q tests/test_event_log_variant_preview.py tests/test_event_log_playback_filters.py tests/test_event_log_variant_coverage.py tests/test_event_log_activity_mappings.py
      - name: Install isolated Chromium and axe
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || {
            # The runner image already has Chromium's libraries; --with-deps only adds fonts and
            # extras. When the apt mirror is unreachable, install the browser without them.
            echo "::warning::apt packages unavailable; installing Chromium without --with-deps"
            node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
          }
      - name: Validate real browser journey syntax
        run: node --check tests/browser/event_log_variant_preview.cjs
      - name: Run actual truncated variant preview journey
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/event_log_variant_preview.cjs
