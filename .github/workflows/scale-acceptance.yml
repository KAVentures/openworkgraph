name: scale-acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes its queued and running checks; pushes to
# branches and manual runs each get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  large-history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify explorer endpoints on a 300k-event history
        env:
          OWG_SCALE_ACCEPTANCE: "1"
        run: python -m pytest -q -s tests/test_large_history_acceptance.py
      - name: Verify the event-log workspace on a 10M-event log
        env:
          OWG_SCALE_ACCEPTANCE: "1"
        run: python -m pytest -q -s tests/test_event_log_scale_acceptance.py
      - name: Verify complete discovery source fingerprints on a 1M-event log
        env:
          OWG_SCALE_ACCEPTANCE: "1"
        run: python -m pytest -q -s tests/test_process_discovery_provenance.py
      - name: Verify arithmetic metrics on 500k cases
        env:
          OWG_SCALE_ACCEPTANCE: "1"
        run: python -m pytest -q -s tests/test_event_log_arithmetic_metrics.py
      - name: Verify bounded selected Jira rescan, replay and correction oracle
        run: python scripts/benchmark_retained_jira.py 1000 30
