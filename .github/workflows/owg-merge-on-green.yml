name: owg-opt-in-merge-on-green

# Runs trusted default-branch code, never a pull request's code or scripts.
# A PR author with same-repository access explicitly opts in by placing
# <!-- OWG-MERGE-ON-GREEN:<current-head-sha> --> in the PR description.
on:
  workflow_run:
    workflows:
      - tests
      - scale-acceptance
      - explorer-accessibility
      - starter-runtimes
      - packaged-launch-smoke
      - tester-release
    types: [completed]
  pull_request_target:
    types: [ready_for_review, edited]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: owg-merge-on-green-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-opted-in:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main (never PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Recheck exact-head CI, reviews, and merge authorization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {run} = require('./.github/scripts/merge_on_green.cjs');
            await run({github, context, core});
