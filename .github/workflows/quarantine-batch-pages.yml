name: quarantine-batch-pages

on:
  pull_request:
    paths:
      - "server/event_log_quarantine.py"
      - "server/event_log_routes.py"
      - "tests/browser/quarantine_batches_app.py"
      - "dashboard/event_log_workspace.js"
      - "tests/js/event_log_quarantine_preview.test.mjs"
      - "docs/EVENT_LOG_QUARANTINE_PREVIEW.md"
      - "tests/test_quarantine_batch_pages.py"
      - "tests/browser/quarantine_batches.cjs"
      - ".github/workflows/quarantine-batch-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "server/event_log_quarantine.py"
      - "server/event_log_routes.py"
      - "tests/browser/quarantine_batches_app.py"
      - "dashboard/event_log_workspace.js"
      - "tests/js/event_log_quarantine_preview.test.mjs"
      - "docs/EVENT_LOG_QUARANTINE_PREVIEW.md"
      - "tests/test_quarantine_batch_pages.py"
      - "tests/browser/quarantine_batches.cjs"
      - ".github/workflows/quarantine-batch-pages.yml"

permissions:
  contents: read

jobs:
  quarantine-batch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local app and tests
        run: python -m pip install -e ".[dev,gateway]"
      - name: Exercise batch pagination and ASGI authorization
        run: python -m pytest -q tests/test_quarantine_batch_pages.py tests/test_quarantine_decision_pagination.py tests/test_event_log_quarantine_bounds.py tests/test_event_log_quarantine.py
      - name: Validate preview and selection behavior
        run: node --test tests/js/event_log_quarantine_preview.test.mjs
      - name: Install isolated Chromium and axe
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || {
            # The runner image already has Chromium's libraries; --with-deps only adds fonts and
            # extras. When the apt mirror is unreachable, install the browser without them.
            echo "::warning::apt packages unavailable; installing Chromium without --with-deps"
            node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
          }
      - name: Validate real browser journey syntax
        run: node --check tests/browser/quarantine_batches.cjs
      - name: Run actual quarantine batch journey
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/quarantine_batches.cjs
