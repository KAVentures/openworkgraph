name: procurement-draft-integration

# Draft procurement changes need actual dependency and integration feedback,
# not only compileall. Ready PRs still use the full repository gates.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'shared/agent_procurement*.py'
      - 'server/agent_procurement*.py'
      - 'tests/test_agent_procurement*.py'
      - 'dashboard/process_catalog.js'
      - 'tests/browser/process_shadow_review.cjs'
      - 'tests/browser/process_shadow_review_app.py'
      - '.github/workflows/procurement-draft-integration.yml'

permissions:
  contents: read

concurrency:
  group: procurement-draft-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-integration:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Import procurement route and all runtime dependencies
        run: python -c "from server import agent_procurement_routes"
      - name: Procurement and scheduler integration tests
        run: python -m pytest -q tests/test_agent_procurement*.py tests/test_local_scheduler.py
      - name: Scope
        run: echo "Focused draft integration only; not a substitute for full ready-for-review CI."

  focused-browser:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWG_JIRA_REMEDIATION_WRITE_ENABLED: '0'
      OWG_JIRA_SOURCE_READ_ENABLED: '0'
      OWG_BROWSER_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check committed dashboard and browser script syntax
        run: |
          node --check dashboard/process_catalog.js
          node --check tests/browser/process_shadow_review.cjs
      - name: Install application and browser dependencies
        run: |
          python -m pip install -e ".[dev,gateway]"
          npm install --prefix "$RUNNER_TEMP/owg-procurement-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/owg-procurement-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run actual local dashboard acceptance
        run: |
          export NODE_PATH="$RUNNER_TEMP/owg-procurement-browser/node_modules"
          node tests/browser/process_shadow_review.cjs
