name: local-signal-overview-browser

on:
  pull_request:
    paths:
      - "server/event_log_signal_overview.py"
      - "server/event_log_routes.py"
      - "dashboard/event_log_workspace.js"
      - "tests/test_event_log_signal_overview.py"
      - "tests/browser/event_log_signal_overview.cjs"
      - ".github/workflows/local-signal-overview-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "server/event_log_signal_overview.py"
      - "server/event_log_routes.py"
      - "dashboard/event_log_workspace.js"
      - "tests/test_event_log_signal_overview.py"
      - "tests/browser/event_log_signal_overview.cjs"
      - ".github/workflows/local-signal-overview-browser.yml"

permissions:
  contents: read

jobs:
  signal-overview-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app, DuckDB and test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Exercise authoritative signal states and dashboard authorization
        run: python -m pytest -q tests/test_event_log_signal_overview.py
      - name: Install isolated Chromium and accessibility scanner
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate browser script syntax
        run: node --check tests/browser/event_log_signal_overview.cjs
      - name: Verify real local all-log signals and deep links
        run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/event_log_signal_overview.cjs
