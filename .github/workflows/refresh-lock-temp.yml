name: refresh-lock-temp

on:
  push:
    branches:
      - "fix/work-evidence-handoff-hardening"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work-evidence-handoff-hardening
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Refresh lockfile and push if changed
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "openworkgraph-ci"
          git config user.email "actions@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh dependency lock"
          git push origin HEAD:fix/work-evidence-handoff-hardening
