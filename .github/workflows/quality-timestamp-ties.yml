name: quality-timestamp-ties
on:
  pull_request:
    paths:
      - 'server/event_log_quality_ties.py'
      - 'server/event_log_routes.py'
      - 'dashboard/event_log_workspace.js'
      - 'tests/test_event_log_quality_ties.py'
      - 'tests/browser/quality_ties_app.py'
      - 'tests/browser/event_log_quality_ties.cjs'
      - '.github/workflows/quality-timestamp-ties.yml'
  push:
    branches: [main]
    paths:
      - 'server/event_log_quality_ties.py'
      - 'server/event_log_routes.py'
      - 'dashboard/event_log_workspace.js'
      - 'tests/test_event_log_quality_ties.py'
      - 'tests/browser/quality_ties_app.py'
      - 'tests/browser/event_log_quality_ties.cjs'
      - '.github/workflows/quality-timestamp-ties.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  timestamp-ties:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,gateway]'
      - run: python -m pytest -q tests/test_event_log_quality_ties.py
      - name: Install browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/owg-browser" playwright@1.64.1 axe-core@4.10.3
          node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install --with-deps chromium || node "$RUNNER_TEMP/owg-browser/node_modules/playwright/cli.js" install chromium
      - run: NODE_PATH="$RUNNER_TEMP/owg-browser/node_modules" node tests/browser/event_log_quality_ties.cjs
