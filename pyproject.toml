[project]
name = "workflow-observer"
version = "0.95.0"
description = "Local-first work evidence, self-hosted organizational context gateway, REST API, and MCP access."
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "xlsxwriter>=3.2,<4",
  "mss>=10,<11",
  "pillow>=11,<12",
  "psutil>=6,<8",
  "mcp[cli]>=2,<3",
  "cryptography>=45,<52",
  "pynput>=1.8,<2; platform_system == 'Darwin' or platform_system == 'Windows'",
  "pyobjc-framework-ApplicationServices>=11,<13; platform_system == 'Darwin'",
  "uiautomation==2.0.29; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gateway = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
workflow-observer = "server.main:main"
workflow-observer-gateway = "server.gateway_runner:main"
workflow-observer-enterprise = "server.enterprise_runner:main"
workflow-observer-enterprise-gateway = "server.enterprise_gateway_runner:main"
workflow-observer-agent-auth = "server.agent_auth:main"
workflow-observer-agent-adapter = "adapters.client:main"
workflow-observer-claude-hook = "adapters.claude_code_hook:main"
workflow-observer-codex-export = "adapters.codex_otel:main"
workflow-observer-openai-agent = "adapters.openai_agents:main"
workflow-observer-policy = "server.policy_admin:main"
workflow-observer-policy-proposal = "server.policy_proposal_cli:main"
workflow-observer-policy-source = "server.policy_source_cli:main"
workflow-observer-policy-drift = "server.policy_drift_cli:main"
workflow-observer-gateway-policy = "server.enterprise_policy_admin:main"
workflow-observer-demo = "server.demo_data:main"
workflow-observer-gateway-enroll = "server.gateway_enroll:main"
workflow-observer-mcp = "mcp_server.secure_stdio:main"
workflow-observer-mcp-compact = "mcp_server.compact_stdio:main"
workflow-observer-mcp-http = "mcp_server.compact_http:main"
