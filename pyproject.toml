[project]
name = "workflow-observer"
version = "0.57.0"
description = "Local-first work evidence, self-hosted organizational context gateway, REST API, and MCP access."
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "xlsxwriter>=3.2,<4",
  "mss>=10,<11",
  "pillow>=11,<12",
  "psutil>=6,<8",
  "mcp[cli]>=2,<3",
  "pynput>=1.8,<2; platform_system == 'Darwin' or platform_system == 'Windows'",
  "pyobjc-framework-ApplicationServices>=11,<13; platform_system == 'Darwin'",
  "uiautomation==2.0.29; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gateway = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
