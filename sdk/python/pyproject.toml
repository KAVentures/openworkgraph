[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworkgraph-agent"
version = "0.117.0"
description = "Dependency-free structural telemetry helper for custom OpenWorkGraph agent harnesses"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Koyar Afrasyab / Kinvectum"}]

[tool.setuptools]
py-modules = ["openworkgraph_agent"]
